<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing Page Builder · Claude Marketing Skills</title>
<meta name="description" content="Fill in a short brief and get a clean, responsive, single-file landing page you can download and deploy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F6F3EE;--ink:#151515;--muted:#6B665E;--line:#E2DCD2;--accent:#FF4D2E;--card:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter Tight",system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);gap:12px}
  header a.home{color:var(--ink);text-decoration:none;font-family:Fraunces,serif;font-size:19px}
  header a.home span{color:var(--accent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:999px;padding:9px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}
  button.primary{background:var(--ink);color:#fff}
  button.primary:hover{background:var(--accent);border-color:var(--accent)}
  button.seg{border-color:var(--line);font-weight:500;padding:6px 12px}
  button.seg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .app{flex:1;display:grid;grid-template-columns:380px 1fr;min-height:0}
  aside{overflow-y:auto;padding:22px;border-right:1px solid var(--line)}
  fieldset{border:none;margin-bottom:26px}
  legend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
  label{display:block;font-weight:500;margin:12px 0 5px}
  input[type=text],input[type=url],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  textarea{resize:vertical;min-height:62px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .theme{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--card);text-align:center;font-size:13px;font-weight:500}
  .theme.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .theme i{display:block;height:34px;border-radius:7px;margin-bottom:6px}
  .check{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:500}
  .check input{accent-color:var(--accent);width:16px;height:16px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--card)}
  .stage{display:flex;flex-direction:column;min-height:0;padding:16px 22px 22px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .bar small{color:var(--muted)}
  .frame-wrap{flex:1;display:flex;justify-content:center;min-height:0}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:14px;background:#fff;transition:width .25s ease;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
  iframe.mobile{width:390px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:860px){
    body{height:auto}
    .app{grid-template-columns:1fr}
    aside{border-right:none;border-bottom:1px solid var(--line)}
    .stage{height:80vh}
    iframe.mobile{width:100%}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../">Landing Page Builder<span>.</span></a>
  <div class="actions">
    <button id="copy">Copy HTML</button>
    <button id="download" class="primary">Download page</button>
  </div>
</header>

<div class="app">
  <aside>
    <form id="f" autocomplete="off">
      <fieldset>
        <legend>1 · The offer</legend>
        <label for="brand">Brand name</label>
        <input type="text" id="brand" value="Northbound">
        <label for="headline">Headline (the outcome)</label>
        <input type="text" id="headline" value="Plan your next trip in 10 minutes, not 10 tabs">
        <label for="sub">Subheadline (how)</label>
        <textarea id="sub">Tell Northbound where you want to go and how you like to travel. Get a day-by-day plan you can edit, share and book.</textarea>
        <div class="row">
          <div><label for="cta">Button text</label><input type="text" id="cta" value="Plan my trip"></div>
          <div><label for="url">Button link</label><input type="url" id="url" value="#start"></div>
        </div>
        <label for="risk">Line under the button</label>
        <input type="text" id="risk" value="Free to try. No card needed.">
      </fieldset>

      <fieldset>
        <legend>2 · Benefits</legend>
        <label for="b1">Benefit 1 — title | text</label>
        <input type="text" id="b1" value="One plan, not fifty tabs | Flights, stays and things to do in a single timeline.">
        <label for="b2">Benefit 2</label>
        <input type="text" id="b2" value="Made for how you travel | Slow mornings or packed days: the plan adapts to you.">
        <label for="b3">Benefit 3</label>
        <input type="text" id="b3" value="Share in one link | Friends can comment and vote without signing up.">
        <p class="hint">Use a <b>|</b> to split the title from the text.</p>
      </fieldset>

      <fieldset>
        <legend>3 · How it works</legend>
        <label for="s1">Step 1</label><input type="text" id="s1" value="Tell us where and when">
        <label for="s2">Step 2</label><input type="text" id="s2" value="Tweak the draft plan">
        <label for="s3">Step 3</label><input type="text" id="s3" value="Share it and go">
      </fieldset>

      <fieldset>
        <legend>4 · FAQ</legend>
        <label for="faq">One per line: question | answer</label>
        <textarea id="faq" rows="5">Is it really free? | Yes. Planning is free. You only pay when you book through a partner.
Do I need an account? | Not to try it. You only need one to save plans.
Which countries does it cover? | Anywhere with public travel data. Coverage grows every month.</textarea>
      </fieldset>

      <fieldset>
        <legend>5 · Style</legend>
        <div class="themes" id="themes">
          <div class="theme on" data-t="clean"><i style="background:linear-gradient(135deg,#fff 50%,#eef0f3 50%)"></i>Clean</div>
          <div class="theme" data-t="bold"><i style="background:linear-gradient(135deg,#111 50%,#222 50%)"></i>Bold</div>
          <div class="theme" data-t="warm"><i style="background:linear-gradient(135deg,#f5efe6 50%,#e9dfd0 50%)"></i>Warm</div>
        </div>
        <label for="accent">Accent colour</label>
        <input type="color" id="accent" value="#2F5BFF">
        <p class="hint" id="contrast"></p>
      </fieldset>

      <fieldset>
        <legend>6 · Sections</legend>
        <label class="check"><input type="checkbox" id="showBenefits" checked> Benefits</label>
        <label class="check"><input type="checkbox" id="showSteps" checked> How it works</label>
        <label class="check"><input type="checkbox" id="showProof"> Testimonial placeholder</label>
        <label class="check"><input type="checkbox" id="showFaq" checked> FAQ</label>
        <label class="check"><input type="checkbox" id="showFinal" checked> Final call-to-action</label>
        <p class="hint">The testimonial block is a clearly marked placeholder. Replace it with a real quote before publishing. Never invent one.</p>
      </fieldset>
    </form>
  </aside>

  <section class="stage">
    <div class="bar">
      <small>Live preview</small>
      <div>
        <button class="seg on" data-v="desktop">Desktop</button>
        <button class="seg" data-v="mobile">Mobile</button>
      </div>
    </div>
    <div class="frame-wrap"><iframe id="preview" title="Landing page preview"></iframe></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let theme = 'clean';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const split = s => { const [a, ...b] = s.split('|'); return [a.trim(), b.join('|').trim()]; };

function luminance(hex){
  const n = parseInt(hex.slice(1),16), rgb=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
}
function contrast(a,b){const l1=luminance(a),l2=luminance(b);return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}

const THEMES = {
  clean:{bg:'#ffffff',ink:'#111318',muted:'#5b6170',soft:'#f3f4f7',font:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',head:'inherit',finalBg:'#111318',finalInk:'#ffffff'},
  bold:{bg:'#0e0e10',ink:'#f5f5f7',muted:'#a1a1aa',soft:'#1b1b1f',font:'"Inter Tight",system-ui,sans-serif',head:'"Inter Tight",system-ui,sans-serif',finalBg:'#f5f5f7',finalInk:'#0e0e10'},
  warm:{bg:'#f7f2ea',ink:'#2a211b',muted:'#6e6157',soft:'#efe6d9',font:'Georgia,"Times New Roman",serif',head:'Fraunces,Georgia,serif',finalBg:'#2a211b',finalInk:'#f7f2ea'}
};

function build(){
  const t = THEMES[theme], accent = $('accent').value;
  const btnText = contrast(accent,'#ffffff') >= 4.5 ? '#ffffff' : '#111111';
  const brand = esc($('brand').value), cta = esc($('cta').value), url = esc($('url').value || '#');
  const headline = esc($('headline').value), sub = esc($('sub').value);
  const faqs = $('faq').value.split('\n').filter(l => l.includes('|')).map(split);
  const fonts = theme==='bold' ? '<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">'
              : theme==='warm' ? '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">' : '';
  const benefits = ['b1','b2','b3'].map(id => split($(id).value));
  const year = new Date().getFullYear();
  const desc = esc($('sub').value.slice(0,155));

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${brand} · ${headline}</title>
<meta name="description" content="${desc}">
<meta property="og:title" content="${brand} · ${headline}">
<meta property="og:description" content="${desc}">
<meta property="og:type" content="website">
${fonts}
<style>
:root{--bg:${t.bg};--ink:${t.ink};--muted:${t.muted};--soft:${t.soft};--accent:${accent};--on-accent:${btnText}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:${t.font};background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
section.wrap{padding:84px 24px}
h1,h2,h3{font-family:${t.head};letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,6vw,4.2rem);line-height:1.04;max-width:15ch}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.12;margin-bottom:10px}
h3{font-size:1.15rem;margin-bottom:6px}
.lead{font-size:1.22rem;color:var(--muted);max-width:50ch;margin:22px 0 34px}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700;padding:16px 30px;border-radius:999px;min-height:44px;font-family:system-ui,sans-serif}
.btn:hover{filter:brightness(1.08)}
.note{font-size:.92rem;color:var(--muted);margin-top:14px}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
nav .logo{font-weight:800;font-size:1.15rem;font-family:${t.head}}
nav .btn{padding:10px 20px;font-size:.95rem}
section.hero{padding-top:56px}
.eyebrow{display:inline-block;width:42px;height:4px;background:var(--accent);border-radius:4px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:34px}
.card{background:var(--soft);border-radius:18px;padding:30px}
.card p,.step p{color:var(--muted)}
.num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;margin-bottom:14px;font-family:system-ui,sans-serif}
.quote{background:var(--soft);border-radius:18px;padding:40px;border:2px dashed var(--muted)}
.quote p{font-size:1.3rem;font-family:${t.head}}
.quote small{display:block;margin-top:12px;color:var(--muted)}
details{border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent);padding:20px 0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--accent);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"−"}
details p{margin-top:10px;color:var(--muted);max-width:65ch}
.final{background:${t.finalBg};color:${t.finalInk};text-align:center;border-radius:24px;padding:80px 24px}
.final h2{max-width:20ch;margin:0 auto}
.final p{opacity:.75;margin:14px auto 30px;max-width:46ch}
footer{padding:36px 0 48px;color:var(--muted);font-size:.9rem}
footer a{color:inherit}
@media (max-width:600px){section.wrap{padding:60px 24px}section.hero{padding-top:32px}}
</style>
</head>
<body>
<div class="wrap"><nav><span class="logo">${brand}</span><a class="btn" href="${url}">${cta}</a></nav></div>
<main>
  <section class="wrap hero">
    <span class="eyebrow" aria-hidden="true"></span>
    <h1>${headline}</h1>
    <p class="lead">${sub}</p>
    <a class="btn" href="${url}">${cta}</a>
    ${$('risk').value ? `<p class="note">${esc($('risk').value)}</p>` : ''}
  </section>
${$('showBenefits').checked ? `
  <section class="wrap">
    <h2>Why ${brand}</h2>
    <div class="grid">
${benefits.map(([h,p]) => `      <div class="card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('\n')}
    </div>
  </section>` : ''}
${$('showSteps').checked ? `
  <section class="wrap">
    <h2>How it works</h2>
    <div class="grid">
${['s1','s2','s3'].map((id,i) => `      <div class="step"><span class="num">${i+1}</span><h3>${esc($(id).value)}</h3></div>`).join('\n')}
    </div>
  </section>` : ''}
${$('showProof').checked ? `
  <!-- TODO: Replace with a REAL customer quote and name, or remove this section. -->
  <section class="wrap">
    <div class="quote">
      <p>“Your real customer's words go here.”</p>
      <small>Name, role · placeholder: replace before publishing</small>
    </div>
  </section>` : ''}
${$('showFaq').checked && faqs.length ? `
  <section class="wrap">
    <h2>Questions</h2>
${faqs.map(([q,a]) => `    <details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('\n')}
  </section>` : ''}
${$('showFinal').checked ? `
  <section class="wrap">
    <div class="final">
      <h2>${headline}</h2>
      <p>${sub}</p>
      <a class="btn" href="${url}">${cta}</a>
    </div>
  </section>` : ''}
</main>
<footer class="wrap">© ${year} ${brand}</footer>
</body>
</html>`;
}

let timer;
function render(){
  clearTimeout(timer);
  timer = setTimeout(() => {
    $('preview').srcdoc = build();
    const accent = $('accent').value;
    const c = contrast(accent, THEMES[theme].bg);
    $('contrast').textContent = c < 3
      ? `⚠️ Low contrast against the background (${c.toFixed(1)}:1). Buttons stay readable, but pick a stronger colour for accents.`
      : `Contrast with background: ${c.toFixed(1)}:1 ✓`;
  }, 120);
}

$('f').addEventListener('input', render);
document.querySelectorAll('.theme').forEach(el => el.addEventListener('click', () => {
  document.querySelectorAll('.theme').forEach(x => x.classList.remove('on'));
  el.classList.add('on'); theme = el.dataset.t; render();
}));
document.querySelectorAll('.seg').forEach(el => el.addEventListener('click', () => {
  document.querySelectorAll('.seg').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  $('preview').classList.toggle('mobile', el.dataset.v === 'mobile');
}));

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
$('download').addEventListener('click', () => {
  const blob = new Blob([build()], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('brand').value || 'landing').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.html';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Page downloaded');
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(build()); toast('HTML copied'); }
  catch { toast('Copy failed. Use Download instead'); }
});
render();
</script>
</body>
</html>
